<!DOCTYPE html>
<html lang="fr" data-amb="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Loge · Grenier</title>
<meta name="theme-color" content="#2b1e16">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" href="../../assets/icons/favicon.png">
<link rel="stylesheet" href="../../noyau/style.css">
<link rel="stylesheet" href="loge.css">
</head>
<body class="loge">
<nav class="barre">
  <a class="retour" href="../../#/" aria-label="Retour au grenier">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Grenier</span>
  </a>
  <h1>La Loge</h1>
</nav>

<header class="scene-loge">
  <div class="mur" aria-hidden="true"></div>
  <figure class="miroir" aria-hidden="true">
    <svg class="ampoules" viewBox="0 0 300 220" preserveAspectRatio="none"></svg>
    <div class="glace"><svg id="miroir-dessin" viewBox="0 0 64 64"></svg></div>
  </figure>
  <div class="etiquette-loge">
    <span class="scotch" aria-hidden="true"></span>
    <b>La Loge</b>
    <small id="scene-titre">coiffure, make-up, soins, ongles, piercings, tatouages</small>
  </div>
  <div class="coiffeuse" aria-hidden="true"></div>
</header>

<nav class="onglets" id="onglets" aria-label="Rayons de la Loge"></nav>

<main id="vue" tabindex="-1"></main>

<dialog id="fiche" class="feuille fiche">
  <form id="fiche-form" method="dialog" novalidate></form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="loge.js"></script>
</body>
</html>
