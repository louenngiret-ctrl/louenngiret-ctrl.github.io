<!DOCTYPE html>
<html lang="fr" data-amb="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Loge · Grenier</title>
<meta name="theme-color" content="#2b1e16">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" type="image/png" href="../../assets/icons/favicon.png">
<link rel="stylesheet" href="../../noyau/style.css">
<link rel="stylesheet" href="loge.css">
</head>
<body class="loge">
<nav class="barre">
  <a class="retour" href="../../#/" aria-label="Retour au grenier">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Grenier</span>
  </a>
  <h1>La Loge</h1>
</nav>

<header class="scene-loge" id="scene">
  <div class="mur" aria-hidden="true"><img class="papier-peint" id="papier-peint" alt=""></div>
  <div class="rideaux" aria-hidden="true"></div>
  <div class="suspensions" id="suspensions" aria-hidden="true"></div>
  <div class="sur-mur" id="sur-mur" aria-hidden="true"></div>
  <div class="coiffeuse" aria-hidden="true"><img class="vis vg" src="../../assets/loge/vis/vis-02.webp" alt=""><img class="vis vd" src="../../assets/loge/vis/vis-17.webp" alt=""></div>
  <div class="cote gauche" id="decor-gauche" aria-hidden="true"></div>
  <figure class="miroir" aria-hidden="true">
    <svg class="ampoules" viewBox="0 0 300 220" preserveAspectRatio="none"></svg>
    <div class="glace"><svg id="miroir-dessin" viewBox="0 0 64 64"></svg></div>
    <img class="vis v1" src="../../assets/loge/vis/vis-09.webp" alt=""><img class="vis v2" src="../../assets/loge/vis/vis-09.webp" alt="">
  </figure>
  <div class="cote droite" id="decor-droite" aria-hidden="true"></div>
  <div class="etiquette-loge">
    <img class="epingle" src="../../assets/loge/epingle.webp" alt="" aria-hidden="true">
    <b>La Loge</b>
    <small id="scene-titre">coiffure, make-up, soins, ongles, piercings, tatouages</small>
  </div>
</header>

<nav class="onglets" id="onglets" aria-label="Rayons de la Loge"></nav>

<main id="vue" tabindex="-1"></main>

<footer class="coulisses" aria-hidden="true">
  <img class="papier" src="../../assets/loge/murs/mur-tatouage.webp" alt="">
  <img class="o tableau" src="../../assets/loge/tableau.webp" alt="">
  <img class="o cadre" src="../../assets/loge/cadre-fleuri.webp" alt="">
  <img class="o lampe-lune" src="../../assets/loge/lampe-lune.webp" alt="">
  <div class="plancher"></div>
  <img class="o tapis" src="../../assets/loge/tapis-rond.webp" alt="">
  <img class="o commode" src="../../assets/loge/commode.webp" alt="">
  <img class="o lit" src="../../assets/loge/lit.webp" alt="">
  <img class="o plaid" src="../../assets/loge/plaid.webp" alt="">
  <img class="o coussin" src="../../assets/loge/coussin.webp" alt="">
  <img class="o vase-haut" src="../../assets/loge/vase-haut.webp" alt="">
  <img class="o bougeoir" src="../../assets/loge/bougeoir-serpent.webp" alt="">
  <img class="o faons" src="../../assets/loge/faons.webp" alt="">
</footer>

<dialog id="fiche" class="feuille fiche">
  <form id="fiche-form" method="dialog" novalidate></form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="loge.js"></script>
</body>
</html>
